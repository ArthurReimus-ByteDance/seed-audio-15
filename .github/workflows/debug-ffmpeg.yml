name: debug-ffmpeg
on:
  push:
    branches: [ci/vercel-deploy]
    paths: [.github/workflows/debug-ffmpeg.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: compare mux argument variants
        run: |
          F=node_modules/ffmpeg-static/ffmpeg
          $F -y -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=25 -f lavfi -i sine=frequency=300 -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/v.mp4 </dev/null
          $F -y -hide_banner -loglevel error -f lavfi -i sine=frequency=880 -t 2 /tmp/a.wav </dev/null
          echo "--- A: current (apad + shortest)"
          timeout 20 $F -y -hide_banner -loglevel error -i /tmp/v.mp4 -i /tmp/a.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -af apad -shortest -movflags +faststart /tmp/A.mp4 </dev/null; echo "exit $?"
          echo "--- B: apad + -t 4"
          timeout 20 $F -y -hide_banner -loglevel error -i /tmp/v.mp4 -i /tmp/a.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -af apad -t 4 -movflags +faststart /tmp/B.mp4 </dev/null; echo "exit $?"
          echo "--- B long audio, apad + -t 4"
          $F -y -hide_banner -loglevel error -f lavfi -i sine=frequency=880 -t 9 /tmp/long.wav </dev/null
          timeout 20 $F -y -hide_banner -loglevel error -i /tmp/v.mp4 -i /tmp/long.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -af apad -t 4 -movflags +faststart /tmp/B2.mp4 </dev/null; echo "exit $?"
          for f in B B2; do $F -hide_banner -i /tmp/$f.mp4 2>&1 | grep -E "Duration|Stream"; done
