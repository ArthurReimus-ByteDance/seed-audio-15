name: debug-ffmpeg
on:
  push:
    branches: [ci/vercel-deploy]
    paths: [.github/workflows/debug-ffmpeg.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: nproc; free -m | head -2
      - name: mux tests alone
        run: npx vitest run src/server/mux.test.ts --reporter=verbose --testTimeout=20000 -t "keeps the picture" 2>&1 | tail -40
      - name: strace-like probe of the first helper
        run: |
          cat > /tmp/probe.mjs <<'JS'
          import { spawn } from "node:child_process";
          import ffmpeg from "/home/runner/work/seed-audio-15/seed-audio-15/node_modules/ffmpeg-static/index.js";
          const run = (args) => new Promise((resolve) => {
            const t = Date.now();
            const child = spawn(ffmpeg, args, { stdio: ["ignore", "ignore", "pipe"] });
            let err = "";
            child.stderr.on("data", d => err += d);
            child.on("close", c => resolve({ code: c, ms: Date.now() - t, err: err.slice(-300) }));
            setTimeout(() => child.kill("SIGKILL"), 25000);
          });
          console.log(await run(["-y","-hide_banner","-loglevel","error","-f","lavfi","-i","testsrc=size=320x240:rate=25","-f","lavfi","-i","sine=frequency=300","-t","4","-c:v","libx264","-pix_fmt","yuv420p","-c:a","aac","/tmp/source.mp4"]));
          JS
          node /tmp/probe.mjs
