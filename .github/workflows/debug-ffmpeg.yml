name: debug-ffmpeg
on:
  push:
    branches: [ci/vercel-deploy]
    paths: [.github/workflows/debug-ffmpeg.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: system ffmpeg
        run: |
          which ffmpeg || echo "no system ffmpeg"
          ffmpeg -version | head -1 || true
          (timeout 30 ffmpeg -y -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=25 -f lavfi -i sine=frequency=300 -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/s.mp4 </dev/null; echo "system exit $?") 2>&1 | tail -5
      - name: bundled ffmpeg
        run: |
          ls -la node_modules/ffmpeg-static/ffmpeg || echo "NO BUNDLED BINARY"
          node_modules/ffmpeg-static/ffmpeg -version | head -1 || true
          (timeout 30 node_modules/ffmpeg-static/ffmpeg -y -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=25 -t 2 -c:v libx264 -pix_fmt yuv420p /tmp/b.mp4 </dev/null; echo "bundled exit $?") 2>&1 | tail -5
      - name: node spawn like the app
        run: |
          cat > /tmp/spawn.mjs <<'JS'
          import { spawn } from "node:child_process";
          const t = Date.now();
          const child = spawn("ffmpeg", ["-y","-hide_banner","-loglevel","error","-f","lavfi","-i","sine=frequency=880","-t","2","/tmp/x.wav"], { stdio: ["ignore","ignore","pipe"] });
          child.stderr.on("data", d => console.log("stderr", d.toString()));
          child.on("close", c => console.log("closed", c, Date.now()-t, "ms"));
          setTimeout(() => { console.log("STILL RUNNING after 20s"); child.kill("SIGKILL"); }, 20000);
          JS
          node /tmp/spawn.mjs
