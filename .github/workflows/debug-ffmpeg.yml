name: debug-ffmpeg
on:
  push:
    branches: [ci/vercel-deploy]
    paths: [.github/workflows/debug-ffmpeg.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: which generation commands hang
        run: |
          F=node_modules/ffmpeg-static/ffmpeg
          t() { echo "--- $1"; shift; timeout 20 "$@" </dev/null; echo "exit $?"; }
          t "video+sine mp4" $F -y -hide_banner -loglevel error -f lavfi -i testsrc=size=320x240:rate=25 -f lavfi -i sine=frequency=300 -t 4 -c:v libx264 -pix_fmt yuv420p -c:a aac /tmp/v.mp4
          t "sine wav -t 2" $F -y -hide_banner -loglevel error -f lavfi -i sine=frequency=880 -t 2 /tmp/a.wav
          t "sine wav -t as input option" $F -y -hide_banner -loglevel error -f lavfi -t 2 -i sine=frequency=880 /tmp/a2.wav
          t "sine wav with duration=" $F -y -hide_banner -loglevel error -f lavfi -i sine=frequency=880:duration=2 /tmp/a3.wav
          t "sine mp3 -t 2" $F -y -hide_banner -loglevel error -f lavfi -i sine=frequency=880 -t 2 /tmp/a.mp3
